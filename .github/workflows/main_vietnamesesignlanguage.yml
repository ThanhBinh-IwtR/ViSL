name: Deploy static website to Azure Web App - VietnameseSignLanguage
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Triển khai các file tĩnh từ thư mục Frontend lên Azure Web App sử dụng Run From Package
      - name: Deploy to Azure Web App using Run From Package
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'VietnameseSignLanguage'  # Tên ứng dụng của bạn trên Azure Web App
          slot-name: 'Production'
          package: './Frontend'  #
