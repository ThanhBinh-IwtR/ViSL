name: Deploy static website to Azure Web App - VietnameseSignLanguage
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Bỏ qua phát hiện nền tảng và xử lý như ứng dụng tĩnh
      - name: Deploy to Azure Web App using Run From Package
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'VietnameseSignLanguage'
          slot-name: 'Production'
          package: './Frontend'
          enable-oryx-build: false  # Bỏ qua phát hiện nền tảng
